name: Refresh social tokens

on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Refresh social tokens that expire within 7 days
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            ${SITE_URL}/api/cron/social-refresh
