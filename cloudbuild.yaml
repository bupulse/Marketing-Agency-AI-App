# Cloud Build: builds the Cloud Run image from this folder's Dockerfile and pushes it to Artifact Registry
# (docs/DEPLOY_CLOUDRUN.md, "Deploy"). The NEXT_PUBLIC_* values are public build values, passed as substitutions:
#   gcloud builds submit --config cloudbuild.yaml --region us-central1 \
#     --substitutions=_SITE_URL=https://bupulse.com,_SUPABASE_URL=...,_SUPABASE_KEY=...,_WHATSAPP=...,_BUILD_SHA=$(git rev-parse HEAD)
# Free tier: 2,500 build-minutes a month on the default e2-standard-2 machine; one build takes about 10 to 15.
substitutions:
  _REGION: us-central1
  _REPO: bupulse
  _SITE_URL: ""
  _SUPABASE_URL: ""
  _SUPABASE_KEY: ""
  _WHATSAPP: ""
  _BUILD_SHA: local
steps:
  - name: gcr.io/cloud-builders/docker
    env: ["DOCKER_BUILDKIT=1"]
    args:
      - build
      - --platform=linux/amd64
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_URL=${_SUPABASE_URL}
      - --build-arg=NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${_SUPABASE_KEY}
      - --build-arg=NEXT_PUBLIC_WHATSAPP_NUMBER=${_WHATSAPP}
      - --build-arg=BUILD_SHA=${_BUILD_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/app:${_BUILD_SHA}
      - --tag=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/app:latest
      - .
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/app:${_BUILD_SHA}
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/app:latest
timeout: 2400s
options:
  logging: CLOUD_LOGGING_ONLY
