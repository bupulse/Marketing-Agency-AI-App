<title>BuPulse Guide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
  /* Layout: a fixed reading column beside a page index, like the BuPulse dashboard (sidebar + content); the
     blue-to-violet pulse is the only colour flourish, on the active page and the header mark. */
  :root {
    --bg: #f5f5f7;
    --surface: #ffffff;
    --text: #1d1d1f;
    --muted: #5e5e63;
    --line: rgba(160, 160, 175, 0.38);
    --blue: #2f6bff;
    --violet: #7b5cff;
    --soft: rgba(47, 107, 255, 0.08);
    --code-bg: #eef0f6;
    --danger: #c81e3a;
    --font-body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --side: 288px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0b0f; --surface: #15151b; --text: #f5f5f7; --muted: #a1a1a6; --line: rgba(255, 255, 255, 0.12);
      --blue: #8db0ff; --violet: #b7a6ff; --soft: rgba(123, 92, 255, 0.16); --code-bg: #1d1d26; --danger: #ff7a8f; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0b0f; --surface: #15151b; --text: #f5f5f7; --muted: #a1a1a6; --line: rgba(255, 255, 255, 0.12);
    --blue: #8db0ff; --violet: #b7a6ff; --soft: rgba(123, 92, 255, 0.16); --code-bg: #1d1d26; --danger: #ff7a8f; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
  a { color: var(--blue); text-underline-offset: 2px; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }

  .top {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px;
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -0.01em; white-space: nowrap; color: var(--text); text-decoration: none; }
  .mark { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, var(--blue), var(--violet)); display: grid; place-items: center; }
  .mark svg { width: 16px; height: 16px; }
  .brand small { font-weight: 500; color: var(--muted); }
  .search { flex: 1; max-width: 460px; margin-left: auto; position: relative; }
  .search input { width: 100%; font: inherit; font-size: 15px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); }
  .menu { display: none; font: inherit; border: 1px solid var(--line); background: var(--bg); color: var(--text); border-radius: 10px; padding: 7px 12px; cursor: pointer; }

  .shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); }
  nav.side {
    position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); align-self: start; height: calc(100vh - 57px); overflow-y: auto;
    padding: 20px 14px 40px max(16px, env(safe-area-inset-left, 0px)); border-right: 1px solid var(--line);
  }
  .side h2 { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 18px 10px 6px; font-weight: 600; }
  .side h2:first-child { margin-top: 0; }
  .side a { display: block; padding: 5px 10px; border-radius: 8px; color: var(--text); text-decoration: none; font-size: 14.5px; line-height: 1.35; }
  .side a:hover { background: var(--soft); }
  .side a[aria-current="page"] { background: var(--soft); color: var(--blue); font-weight: 600; box-shadow: inset 3px 0 0 var(--violet); }
  .side .pending { color: var(--muted); font-size: 13.5px; padding: 4px 10px; }

  main { min-width: 0; padding-block: 28px 80px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  article { max-width: 860px; margin: 0 auto; }
  .where { display: inline-flex; gap: 8px; align-items: center; font-family: var(--font-mono); font-size: 12.5px; color: var(--muted); background: var(--code-bg); padding: 3px 9px; border-radius: 6px; margin-bottom: 10px; }
  article h1 { font-size: clamp(1.9rem, 1.4rem + 1.6vw, 2.6rem); line-height: 1.15; letter-spacing: -0.025em; margin: 4px 0 14px; text-wrap: balance; }
  article h2 { font-size: 1.45rem; letter-spacing: -0.015em; margin: 2.2em 0 0.6em; padding-top: 0.6em; border-top: 1px solid var(--line); text-wrap: balance; }
  article h3 { font-size: 1.12rem; margin: 1.7em 0 0.4em; }
  article p, article li { max-width: 72ch; }
  article li + li { margin-top: 0.25em; }
  article img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 12px; margin: 14px 0 6px; background: var(--surface); }
  article video { display: block; width: 100%; max-width: 100%; border-radius: 12px; border: 1px solid var(--line); background: #000; margin: 14px 0 6px; }
  article .missing { border: 1px dashed var(--line); border-radius: 12px; padding: 14px; color: var(--muted); font-size: 14px; margin: 14px 0; }
  article code { font-family: var(--font-mono); font-size: 0.86em; background: var(--code-bg); padding: 0.12em 0.38em; border-radius: 5px; overflow-wrap: anywhere; }
  article pre { background: var(--code-bg); border-radius: 10px; padding: 14px 16px; overflow-x: auto; font-size: 13.5px; line-height: 1.5; }
  article pre code { background: none; padding: 0; overflow-wrap: normal; }
  .table { overflow-x: auto; margin: 14px 0; border: 1px solid var(--line); border-radius: 10px; }
  article table { border-collapse: collapse; width: 100%; font-size: 14.5px; font-variant-numeric: tabular-nums; }
  article th, article td { text-align: left; vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  article th { background: var(--soft); font-weight: 600; white-space: nowrap; }
  article tr:last-child td { border-bottom: 0; }
  article blockquote { margin: 16px 0; padding: 10px 16px; border-left: 3px solid var(--violet); background: var(--soft); border-radius: 0 10px 10px 0; }
  .repo { font-family: var(--font-mono); font-size: 0.86em; background: var(--code-bg); padding: 0.12em 0.38em; border-radius: 5px; overflow-wrap: anywhere; color: var(--text); }
  .pager { display: flex; justify-content: space-between; gap: 12px; margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .pager a { text-decoration: none; display: flex; flex-direction: column; font-weight: 600; max-width: 48%; }
  .pager a span { font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .pager a.next { margin-left: auto; text-align: right; }
  .demos { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; margin-top: 14px; }
  .demos figure { margin: 0; }
  .demos figcaption { font-size: 14px; font-weight: 600; }
  .demos video { margin: 6px 0 0; }
  .results { list-style: none; padding: 0; }
  .results li { padding: 12px 0; border-bottom: 1px solid var(--line); max-width: none; }
  .results small { display: block; color: var(--muted); }
  mark { background: rgba(123, 92, 255, 0.22); color: inherit; border-radius: 3px; padding: 0 2px; }

  @media (max-width: 860px) {
    .shell { grid-template-columns: minmax(0, 1fr); }
    .menu { display: inline-block; }
    nav.side { display: none; position: fixed; top: calc(env(safe-area-inset-top, 0px) + 57px); left: 0; right: 0; bottom: 0; height: auto; z-index: 4; background: var(--surface); border-right: 0; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
    nav.side.open { display: block; }
    .brand small { display: none; }
  }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<header class="top">
  <button class="menu" id="menu" type="button" aria-expanded="false" aria-controls="side">Pages</button>
  <a class="brand" href="#start" aria-label="BuPulse guide, start page">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 16 16" fill="none"><path d="M1 8.5h3l2-5 3 9 2-4h4" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    BuPulse <small>Guide</small>
  </a>
  <div class="search"><input id="q" type="search" placeholder="Search the guide (a page, a file, a function)" aria-label="Search the guide" autocomplete="off"></div>
</header>
<div class="shell">
  <nav class="side" id="side" aria-label="Guide pages"></nav>
  <main><article id="page" aria-live="polite"></article></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script>
  const DATA = /*GUIDE_DATA*/null;
  const byId = new Map(DATA.pages.map((p) => [p.id, p]));
  const side = document.getElementById("side");
  const article = document.getElementById("page");
  const q = document.getElementById("q");
  const menu = document.getElementById("menu");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const slug = (s) => s.toLowerCase().replace(/<[^>]+>/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  // Sidebar
  const sections = ["Start", "Install", "Client features", "Admin console", "Code"];
  side.innerHTML = sections.map((s) => {
    const list = DATA.pages.filter((p) => p.section === s);
    const items = list.length ? list.map((p) => `<a href="#${p.id}" data-id="${p.id}">${esc(p.title.replace(/^BuPulse guide: /i, ""))}</a>`).join("") : `<div class="pending">Added after the admin sign-in.</div>`;
    return `<h2>${s}</h2>${items}`;
  }).join("") + (DATA.demos.length ? `<h2>Videos</h2><a href="#demo-videos" data-id="demo-videos">Demo videos</a>` : "");

  marked.use({ gfm: true });
  const renderer = new marked.Renderer();
  renderer.heading = (text, level) => `<h${level} id="${slug(text)}">${text}</h${level}>`;
  renderer.table = (header, body) => `<div class="table"><table><thead>${header}</thead><tbody>${body}</tbody></table></div>`;

  function fixMedia(root) {
    root.querySelectorAll("img").forEach((img) => {
      img.loading = "lazy";
      img.decoding = "async";
      img.addEventListener("error", () => {
        const box = document.createElement("div");
        box.className = "missing";
        box.textContent = `Screenshot not captured yet: ${img.getAttribute("src")}`;
        img.replaceWith(box);
      });
    });
    root.querySelectorAll("video").forEach((v) => { v.preload = "metadata"; v.playsInline = true; v.muted = true; });
    root.querySelectorAll('a[href^="repo:"]').forEach((a) => {
      const span = document.createElement("span");
      span.className = "repo";
      span.title = "File in the BuPulse code";
      span.textContent = a.textContent.includes("/") || a.textContent.includes(".") ? a.textContent : a.getAttribute("href").slice(5);
      a.replaceWith(span);
    });
    root.querySelectorAll('a[href^="http"]').forEach((a) => { a.target = "_blank"; a.rel = "noopener noreferrer"; });
  }

  function demoPage() {
    return `<h1>Demo videos</h1><p>The narrated demo videos made for social media, landscape versions. The longer in-person versions and the vertical (9:16) versions are in the <code>Demo/</code> folder on the owner's Mac.</p>
      <div class="demos">${DATA.demos.map((d) => `<figure><figcaption>${esc(d.title)}</figcaption><video src="${d.src}" controls preload="metadata" playsinline></video><small class="repo">${esc(d.path)}</small></figure>`).join("")}</div>`;
  }

  function pager(i) {
    const prev = DATA.pages[i - 1], next = DATA.pages[i + 1];
    return `<nav class="pager" aria-label="Previous and next page">${prev ? `<a href="#${prev.id}"><span>Previous</span>${esc(prev.title)}</a>` : ""}${next ? `<a class="next" href="#${next.id}"><span>Next</span>${esc(next.title)}</a>` : ""}</nav>`;
  }

  function show(route, { focus = false } = {}) {
    const [id, anchor] = (route || "start").split("~");
    side.querySelectorAll("a").forEach((a) => { if (a.dataset.id === id) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    if (id === "demo-videos") {
      article.innerHTML = demoPage();
    } else {
      const page = byId.get(id) ?? byId.get("start");
      const i = DATA.pages.indexOf(page);
      article.innerHTML = `<div class="where">${esc(page.file)}</div>` + marked.parse(page.md, { renderer }) + pager(i);
      document.title = page.id === "start" ? "BuPulse Guide" : `${page.title} · BuPulse Guide`;
    }
    fixMedia(article);
    side.classList.remove("open");
    menu.setAttribute("aria-expanded", "false");
    const target = anchor && document.getElementById(anchor);
    if (target) target.scrollIntoView();
    else window.scrollTo(0, 0);
    if (focus) article.querySelector("h1")?.focus?.();
  }

  // In-page anchors ("On this page" lists) scroll inside the current page instead of changing the route.
  article.addEventListener("click", (e) => {
    const a = e.target.closest("a[href^='#']");
    if (!a) return;
    const raw = a.getAttribute("href").slice(1);
    if (byId.has(raw.split("~")[0]) || raw === "demo-videos") return;
    const el = document.getElementById(raw);
    if (el) { e.preventDefault(); el.scrollIntoView(); }
  });

  function search(term) {
    const t = term.trim().toLowerCase();
    if (t.length < 2) return show(location.hash.slice(1));
    const hits = [];
    for (const p of DATA.pages) {
      const text = p.md.replace(/!\[[^\]]*\]\([^)]*\)|<[^>]+>/g, " ");
      const lower = text.toLowerCase();
      let at = lower.indexOf(t), count = 0;
      if (at < 0 && !p.title.toLowerCase().includes(t)) continue;
      for (let j = at; j >= 0; j = lower.indexOf(t, j + t.length)) count++;
      const from = Math.max(0, at - 70);
      const snippet = at >= 0 ? esc(text.slice(from, at + t.length + 90)).replace(new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig"), (m) => `<mark>${m}</mark>`) : "";
      hits.push({ p, count: count + (p.title.toLowerCase().includes(t) ? 5 : 0), snippet });
    }
    hits.sort((a, b) => b.count - a.count);
    article.innerHTML = `<h1>Search: ${esc(term)}</h1><p>${hits.length} page${hits.length === 1 ? "" : "s"}.</p><ul class="results">${hits.map((h) => `<li><a href="#${h.p.id}">${esc(h.p.title)}</a><small>${esc(h.p.section)} · ${esc(h.p.file)}</small>${h.snippet ? `<div>…${h.snippet}…</div>` : ""}</li>`).join("")}</ul>`;
  }

  let timer;
  q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(() => search(q.value), 160); });
  menu.addEventListener("click", () => { const open = side.classList.toggle("open"); menu.setAttribute("aria-expanded", String(open)); });
  window.addEventListener("hashchange", () => { q.value = ""; show(location.hash.slice(1)); });
  show(location.hash.slice(1));
</script>
